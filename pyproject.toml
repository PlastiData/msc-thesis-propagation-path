[project]
name = "msc-thesis-propagation-path"
version = "0.1.0"
description = "Evidence-backed failure propagation paths for cloud-native RCA (MSc thesis)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Alexis Marin" }]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["analysis"]
include = ["evidence*"]

[tool.pytest.ini_options]
pythonpath = ["analysis"]
testpaths = ["analysis/test_evidence_poc.py"]
